# Use pipe (|) for multiline entries.
subtext: |
  Correlates GPU/Neuron/EFA metrics to pod/namespace/container for devices allocated via
  Dynamic Resource Allocation by watching Pods and ResourceClaims. Resolves template-generated
  claim names from pod status, and derives the metric key from either the DRA device name
  (dra_device_id_pattern) or a ResourceSlice attribute (dra_device_id_attribute).
